# Publish @enconvert/node-sdk to npm (with signed Sigstore provenance) on every
# version tag.
#
# AUTH MODEL
#   npm publish → TOKENLESS via npm Trusted Publishing (GitHub OIDC). There is
#   no npm token secret; the OIDC exchange is also what generates provenance.
#
# ── One-time setup this workflow DEPENDS ON ──────────────────────────────────
#   1. npmjs.com → package @enconvert/node-sdk → Settings → Trusted Publisher:
#        provider = GitHub Actions, org/user = enconvert, repo = node-sdk,
#        workflow filename = publish.yml, environment = (blank).
#   2. github.com/enconvert/node-sdk must be a PUBLIC repo: npm only generates
#        provenance for a public repo + public package.
#
# ── Version pins ─────────────────────────────────────────────────────────────
#   npm Trusted Publishing requires npm >= 11.5.1. Node 24 already BUNDLES
#   npm 11.6+, so we use Node 24 and do NOT self-upgrade npm. (Running
#   `npm install -g npm@latest` in place corrupts the bundled `sigstore` module
#   and breaks `npm publish --provenance` with "Cannot find module 'sigstore'".)
#   The package still targets its engines.node range for CONSUMERS; only the
#   publish RUNNER needs Node 24. Provenance requires a cloud runner
#   (ubuntu-latest); self-hosted is unsupported.
#
# Consider pinning the third-party actions below to full commit SHAs for
# supply-chain hardening once you're happy with the flow.

name: Publish

on:
  push:
    tags:
      - "v*.*.*"          # cut a release with:  git tag v0.2.0 && git push origin v0.2.0

permissions:
  contents: read          # least privilege
  id-token: write         # REQUIRED for npm Trusted Publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"                          # bundles npm 11.6+ (>= 11.5.1 for trusted publishing)
          registry-url: "https://registry.npmjs.org"  # writes ~/.npmrc so publish targets npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (tsup → ./dist)
        run: npm run build

      # dist/bin.js is the `enconvert-sdk` CLI and MUST keep its shebang, or a
      # global install produces a binary the shell cannot execute. dist/index.js
      # is the library entry and must NOT have one.
      # Written with `if`, not `cmd && { exit 1; }`: GitHub runs `run:` under
      # `bash -e`, where a failing `&&` list aborts the step -- which is the
      # PASSING case for the "must not have a shebang" assertion.
      - name: Verify bin entry shebang
        run: |
          if ! head -1 dist/bin.js | grep -qx '#!/usr/bin/env node'; then
            echo "::error::dist/bin.js is missing its #!/usr/bin/env node shebang"
            exit 1
          fi
          if head -1 dist/index.js | grep -q '^#!'; then
            echo "::error::dist/index.js is a library entry and must not have a shebang"
            exit 1
          fi
          echo "shebang check ok"

      - name: Verify the tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }

      - name: Lint the package (publint + are-the-types-wrong)
        run: npm run lint:pkg

      # Under Trusted Publishing provenance is automatic; the explicit
      # --provenance flag is a harmless, idempotent guarantee that
      # dist.attestations gets written.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
